<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AvtoBuy: INFINITY PEREKUP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-container">
        <!-- Верхний бар -->
        <div class="status-bar">
            <span id="phone-time">15:31</span>
            <span class="geo-badge">📍 <span id="current-city-badge">Тула</span></span>
            <span>📶 🔋 63%</span>
        </div>

        <!-- ЭКРАН 1: РАБОЧИЙ СТОЛ (ХАБ) -->
        <div id="screen-home" class="desktop-screen">
            <div class="app-grid">
                <div class="app-icon" onclick="openApp('avtobuy')">
                    <div class="icon-box blue">🚗</div>
                    <span>AvtoBuy</span>
                </div>
                <div class="app-icon" onclick="openApp('bank')">
                    <div class="icon-box orange">🏦</div>
                    <span>П-Банк</span>
                </div>
                <div class="app-icon" onclick="openApp('garage')">
                    <div class="icon-box teal">🏠</div>
                    <span>Гараж</span>
                </div>
                <div class="app-icon" onclick="openApp('map')">
                    <div class="icon-box red">🗺️</div>
                    <span>Транспорт</span>
                </div>
                <div class="app-icon" onclick="goToSleep()">
                    <div class="icon-box black">💤</div>
                    <span>Сон</span>
                </div>
            </div>
        </div>

        <!-- ПРИЛОЖЕНИЕ: П-БАНК -->
        <div id="app-bank" class="app-window hidden">
            <header class="app-header orange">
                <button class="btn-back" onclick="closeApp()">⬅️</button>
                <h2>П-Банк</h2>
            </header>
            <div class="app-content">
                <div class="bank-card">
                    <p>ВАШ БАЛАНС</p>
                    <h1><span id="bank-balance">75 893</span> ₽</h1>
                </div>
                <h3>История операций</h3>
                <div class="history-list" id="bank-history">
                    <!-- Сюда летят логи транзакций -->
                </div>
            </div>
        </div>

        <!-- ПРИЛОЖЕНИЕ: AVTOBUY -->
        <div id="app-avtobuy" class="app-window hidden">
            <header class="app-header blue">
                <button class="btn-back" onclick="closeApp()">⬅️</button>
                <h2>Объявления: <span id="current-market-city">Тула</span></h2>
            </header>
            <div class="app-content" id="feed-container">
                <!-- Объявления машин -->
            </div>
        </div>

        <!-- ПРИЛОЖЕНИЕ: ЧАТ ТОРГА -->
        <div id="app-chat" class="app-window hidden">
            <header class="app-header chat-head">
                <button class="btn-back" onclick="openApp('avtobuy')">⬅️ Назад</button>
                <h2 id="chat-seller-name">Продавец</h2>
            </header>
            <div class="chat-container">
                <div class="chat-messages" id="chat-box"></div>
                <div class="chat-input-area" id="chat-controls"></div>
            </div>
        </div>

        <!-- ПРИЛОЖЕНИЕ: ГАРАЖ -->
        <div id="app-garage" class="app-window hidden">
            <header class="app-header teal">
                <button class="btn-back" onclick="closeApp()">⬅️</button>
                <h2>Ваш Автопарк</h2>
            </header>
            <div class="app-content" id="garage-container"></div>
        </div>

        <!-- ПРИЛОЖЕНИЕ: ТРАНСПОРТ (КАРТА ГОРОДОВ) -->
        <div id="app-map" class="app-window hidden">
            <header class="app-header red">
                <button class="btn-back" onclick="closeApp()">⬅️</button>
                <h2>Куда едем?</h2>
            </header>
            <div class="app-content">
                <p class="map-hint">Вы сейчас находитесь в: <b id="map-current-city">Тула</b></p>
                <div class="city-list" id="city-travel-list">
                    <!-- Города для путешествий -->
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
